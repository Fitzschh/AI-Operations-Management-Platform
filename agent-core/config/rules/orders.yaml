pack: orders
version: 1
rules:
  - rule_id: orders.demand_spike
    enabled: true
    category: DEMAND_SPIKE
    evaluator: threshold
    metric: orders.count_15m
    operator: ">"
    value: 20
    severity_bands: [{when: "> 20", severity: HIGH}]
    suppression: {cooldown_minutes: 30, hysteresis: {clear_when: "<= 12"}}
    analyst_policy: LLM_ALWAYS
  - rule_id: orders.cancellation_spike
    enabled: true
    category: CANCELLATION_SPIKE
    evaluator: rate
    metric: orders.cancellation_rate_30m
    operator: ">"
    value: 0.10
    severity_bands: [{when: "> 0.10", severity: HIGH}]
    suppression: {cooldown_minutes: 30, hysteresis: {clear_when: "<= 0.05"}}
    analyst_policy: LLM_ALWAYS
