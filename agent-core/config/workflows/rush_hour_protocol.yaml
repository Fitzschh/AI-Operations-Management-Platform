template: rush_hour_protocol
version: 1
description: Coordinated response to a demand spike colliding with kitchen overload.
parameters:
  menu_item_id: string
steps:
  - tool: set_menu_item_availability
    args:
      menu_item_id: "{{menu_item_id}}"
      available: false
      reason: "Temporary 86 during rush to protect kitchen throughput."
  - tool: send_notification
    args:
      channel: kitchen
      audience: kitchen
      template_id: rush_hour_activated
      variables: {menu_item_id: "{{menu_item_id}}"}
on_step_failure: halt_and_compensate
